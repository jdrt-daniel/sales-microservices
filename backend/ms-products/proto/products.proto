syntax = "proto3";

package products;

service ProductsGrpcService {
  rpc GetProduct (ProductIdRequest) returns (ProductResponse);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc AdjustStock (AdjustStockRequest) returns (ProductResponse);
}

message ProductIdRequest {
  string id = 1;
}

message CheckStockRequest {
  string id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  int32 currentStock = 2;
}

// quantity puede ser negativo (venta) o positivo (compra)
message AdjustStockRequest {
  string id = 1;
  int32 quantity = 2;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
  bool found = 5;
}
